name: Feature request
description: Suggest a new feature, AdGuard Home API integration, or UI improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what you would like added or improved.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve in your AdGuard Home workflow?
    validations:
      required: true
  - type: input
    id: agh-api
    attributes:
      label: Related AdGuard Home API endpoint or feature (optional)
      placeholder: e.g. /control/clients, /control/dhcp/status, Quick Settings tile
  - type: textarea
    id: additional
    attributes:
      label: Additional context or mockups (optional)
