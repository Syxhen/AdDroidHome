name: Release

# Pushing a v* tag builds both addroidhome.apk (standard release) and
# addroidhome-debug.apk (side-by-side debug build) and publishes them as
# release assets alongside SHA256SUMS.txt.
# A tag with a suffix (v1.1.0-beta.1, v1.1.0-rc.1) is published as a
# pre-release: it is never "latest". Its notes come from the "Unreleased"
# CHANGELOG section.
#
# For consistent release signing across updates, set repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# If unset, the workflow signs the release APK with a temporary keystore so
# addroidhome.apk remains directly installable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build APKs for (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "app/build.gradle.kts says $version but the tag is $TAG" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release and debug APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            export KEYSTORE_FILE="$PWD/release-keystore.jks"
          else
            keytool -genkeypair -v -keystore release-keystore.jks \
              -storepass addroidhome -keypass addroidhome \
              -alias addroidhome -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AdDroid Home,O=Syxhen"
            export KEYSTORE_FILE="$PWD/release-keystore.jks"
            export KEYSTORE_PASSWORD="addroidhome"
            export KEY_ALIAS="addroidhome"
            export KEY_PASSWORD="addroidhome"
          fi

          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/release/addroidhome-release.apk addroidhome.apk
          cp app/build/outputs/apk/debug/addroidhome-debug.apk addroidhome-debug.apk
          sha256sum addroidhome.apk addroidhome-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          rm -f release-keystore.jks

      - name: Extract the release notes from CHANGELOG.md
        run: |
          case $TAG in *-*) v=Unreleased ;; *) v=${TAG#v} ;; esac
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $v" >&2; exit 1; }
          cat notes.md

      - name: Publish
        run: |
          set -euo pipefail

          retry() {
            local attempt=1 max=4 delay=5
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "Command failed after $max attempts: $*" >&2
                return 1
              fi
              echo "Attempt $attempt failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          case $TAG in *-*) pre=--prerelease ;; *) pre=--latest ;; esac

          is_draft=$(gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null || echo "missing")

          # Create a draft release first when missing so partial uploads are never exposed.
          if [ "$is_draft" = "missing" ]; then
            retry gh release create "$TAG" --verify-tag --draft "$pre" \
              --title "AdDroid Home ${TAG#v}" --notes-file notes.md
          fi

          # Upload assets sequentially with retries to avoid uploads.github.com 5xx errors.
          for asset in addroidhome.apk addroidhome-debug.apk SHA256SUMS.txt; do
            retry gh release upload "$TAG" "$asset" --clobber
          done

          # Publish new or recovered draft releases without changing --latest on older published tags.
          if [ "$is_draft" != "false" ]; then
            retry gh release edit "$TAG" --draft=false "$pre" \
              --title "AdDroid Home ${TAG#v}" --notes-file notes.md
          fi
